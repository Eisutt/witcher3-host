stages:
  - deploy

deploy_production:
  stage: deploy
  tags:
    - Witcher
  script:
    - echo "Начинаем автоматический деплой..."
    - cd docker
    
    # 1. Достаем секреты: GitLab сам создаст файл из переменной, а мы копируем его как .env
    - cp $DOTENV_FILE .env
    
    # 2. Достаем SSL-сертификаты: копируем их из твоей старой папки в новую папку Раннера
    - mkdir -p ./configs/certbot
    - sudo cp -r /home/eisutt/witcher3-host/project/docker/configs/certbot/conf ./configs/certbot/
    
    # 3. Гасим старые контейнеры (если они были запущены Раннером) и поднимаем новые
    - docker compose down
    - docker compose up -d --build
    
    - echo "Деплой успешно завершен!"
  only:
    - main