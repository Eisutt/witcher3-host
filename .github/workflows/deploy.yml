name: Deploy to Selectel

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      # 1. Скачиваем актуальный код
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Создаем файл .env из секретов GitHub
      - name: Create .env file
        run: |
          echo "${{ secrets.PROD_ENV }}" > project/docker/.env

      # 3. Копируем SSL-сертификаты из старой рабочей папки
      - name: Copy SSL certificates
        run: |
          mkdir -p project/docker/configs/certbot
          sudo cp -r /home/eisutt/witcher3-host/project/docker/configs/certbot/conf project/docker/configs/certbot/
      
      # Создаем alertmanager.yml из секретов
      - name: Create Alertmanager config
        run: |
          cat <<EOF > project/docker/configs/alertmanager/alertmanager.yml
          route:
            receiver: 'tg_bot'
            repeat_interval: 15m
          receivers:
            - name: 'tg_bot'
              telegram_configs:
                - bot_token: '${{ secrets.TG_BOT_TOKEN }}'
                  chat_id: ${{ secrets.TG_CHAT_ID }}
          EOF

      # 4. Перезапускаем Docker Compose
      - name: Restart Docker containers
        run: |
          cd project/docker
          docker compose down
          docker compose up -d --build